<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAA Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}header{padding:16px 18px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#080808;z-index:5}h1{margin:0;font-size:21px;letter-spacing:1px}h2{margin:0 0 12px}.wrap{max-width:1200px;margin:auto;padding:18px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.tabs button,.action{background:#1d1d1d;color:#fff;border:1px solid #444;border-radius:9px;padding:10px 13px;white-space:nowrap;cursor:pointer}.tabs button.active,.primary{background:#d71920;border-color:#d71920}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:16px}.card{background:#141414;border:1px solid #303030;border-radius:13px;padding:15px;margin-bottom:14px}.big{font-size:28px;font-weight:900}.muted{color:#aaa;font-size:13px}.subtle{color:#777;font-size:12px}table{width:100%;border-collapse:collapse;background:#101010}th,td{padding:10px;border-bottom:1px solid #292929;text-align:left;font-size:13px;vertical-align:top}th{color:#aaa}input,select,textarea{width:100%;padding:10px;background:#0c0c0c;border:1px solid #444;color:#fff;border-radius:8px;margin:5px 0 10px}textarea{min-height:80px}label{font-size:12px;color:#bbb}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.hide{display:none}.badge{padding:4px 7px;border-radius:99px;background:#292929;font-size:11px}.open{color:#6df08a}.closed{color:#ff7070}.eventrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #292929}.eventrow:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.search{margin-bottom:12px}.empty{padding:15px;border:1px dashed #444;border-radius:9px;color:#aaa}@media(max-width:650px){.row{grid-template-columns:1fr}table{font-size:12px}.eventrow{grid-template-columns:1fr}.actions .action{flex:1}}
</style></head><body><header><h1>FLORIDA ARMWRESTLING — ADMIN</h1><div class="actions"><button class="action" onclick="location.href='/'">Open Site</button><button class="action" onclick="logout()">Sign Out</button></div></header><div class="wrap">
<div id="login" class="card"><h2>Admin Sign In</h2><p class="muted">Use the FAA admin account connected to this site.</p><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="action primary" onclick="login()">Sign In</button> <span id="loginMsg" class="muted"></span></div>
<div id="app" class="hide"><div class="tabs"><button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('events',this)">Events</button><button onclick="tab('roster',this)">Registrations</button><button onclick="tab('athletes',this)">Athletes</button><button onclick="tab('results',this)">Results</button></div>
<section id="dash" class="panel active"><div class="grid" id="stats"></div><div class="card"><h2>Upcoming Events</h2><div id="dashEvents"></div></div><div class="card"><h2>Recent Registrations</h2><div id="recent"></div></div></section>
<section id="events" class="panel"><div class="card"><h2>Create Event</h2><div class="row"><div><label>Name</label><input id="ename"></div><div><label>Date</label><input id="edate" type="date"></div><div><label>Venue / Location</label><input id="eloc"></div><div><label>Address</label><input id="eaddr"></div><div><label>Entry Fee</label><input id="efee" type="number" min="0"></div><div><label>Entry Unit</label><select id="eunit"><option>per hand</option><option>per class</option></select></div><div><label>Doors Time</label><input id="edoors" placeholder="11:00 AM"></div><div><label>Pulls Start</label><input id="estart" placeholder="12:00 PM"></div></div><label>Weight Classes (comma separated)</label><input id="eweights" value="154 lbs,176 lbs,198 lbs,220 lbs,242 lbs,243+ lbs"><label>Categories (comma separated)</label><input id="ecats" value="Kids,Ladies,Amateur,Pro,Masters"><label>Prizes (one per line)</label><textarea id="eprizes">1st Place\n2nd Place\n3rd Place</textarea><label>Description</label><textarea id="edesc"></textarea><button class="action primary" onclick="createEvent()">Create Event</button> <span id="eventMsg" class="muted"></span></div><div class="card"><h2>Manage Events</h2><div id="eventsTable"></div></div></section>
<section id="roster" class="panel"><div class="card"><h2>Registration Roster</h2><input class="search" id="regSearch" placeholder="Search athlete, event, or division" oninput="renderRoster()"><div id="regTable"></div></div></section>
<section id="athletes" class="panel"><div class="card"><h2>Athletes</h2><input class="search" id="athSearch" placeholder="Search athletes" oninput="renderAthletes()"><div id="athTable"></div></div></section>
<section id="results" class="panel"><div class="card"><h2>Enter Result</h2><div class="row"><div><label>Event</label><select id="revent"></select></div><div><label>Division</label><input id="rdiv" placeholder="198 lbs • Right"></div><div><label>Athlete</label><input id="rath"></div><div><label>Place</label><input id="rplace" type="number" min="1"></div></div><button class="action primary" onclick="addResult()">Save Result</button> <span id="resultMsg" class="muted"></span></div><div class="card"><h2>Saved Results</h2><div id="resultsTable"></div></div></section>
</div></div>
<script>
const $=id=>document.getElementById(id);let data=null;
async function api(p,o={}){o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});const t=localStorage.getItem('faa_token');if(t)o.headers.Authorization='Bearer '+t;const r=await fetch(p,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('pw').value})});if(d.user.role!=='admin')throw Error('This account is not an admin.');localStorage.setItem('faa_token',d.token);showApp();await load()}catch(e){$('loginMsg').textContent=e.message}}
function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide')}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('faa_token');location.reload()}
async function load(){try{data=await api('/api/admin/dashboard');renderAll()}catch(e){$('loginMsg').textContent=e.message;$('login').classList.remove('hide');$('app').classList.add('hide')}}
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const date=x=>new Date(x+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const eventName=id=>data.events.find(e=>e.id===id)?.name||id;
function renderAll(){renderDash();renderEvents();renderRoster();renderAthletes();renderResults()}
function renderDash(){$('stats').innerHTML=[['Events',data.events.length],['Athletes',data.users.length],['Registrations',data.registrations.length],['Results',data.results.length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');$('dashEvents').innerHTML=data.events.filter(e=>e.date>='2026-09-09').map(e=>`<div class="eventrow"><div><b>${esc(e.name)}</b><div class="muted">${date(e.date)} • ${esc(e.location)} • $${e.entryFee} ${esc(e.entryUnit||'')}</div></div><span class="badge ${e.status==='open'?'open':'closed'}">${esc(e.status)}</span></div>`).join('')||'<div class="empty">No upcoming events.</div>';$('recent').innerHTML=data.registrations.slice().reverse().slice(0,10).map(r=>{const u=data.users.find(x=>x.id===r.userId);return `<div class="eventrow"><div><b>${esc(u?.name||'Unknown')}</b><div class="muted">${esc(eventName(r.eventId))} • ${esc(r.division)}</div></div><span class="badge">${esc(r.status)}</span></div>`}).join('')||'<div class="empty">No registrations yet.</div>'}
function renderEvents(){$('eventsTable').innerHTML=data.events.map(e=>`<div class="card" style="background:#0d0d0d"><div class="eventrow"><div><b>${esc(e.name)}</b><div class="muted">${date(e.date)} • ${esc(e.location)}<br>${esc(e.address||'')}<br>$${e.entryFee} ${esc(e.entryUnit||'')} • ${esc(e.status)}</div></div><button class="action" onclick="editEvent('${e.id}')">Edit</button></div><div class="subtle" style="margin-top:8px">${(e.weightClasses||e.divisions||[]).join(' • ')}</div></div>`).join('')||'<div class="empty">No events.</div>'}
function renderRoster(){const q=($('regSearch')?.value||'').toLowerCase();const rows=data.registrations.filter(r=>{const u=data.users.find(x=>x.id===r.userId),s=[u?.name,eventName(r.eventId),r.division,r.status].join(' ').toLowerCase();return s.includes(q)});$('regTable').innerHTML=rows.length?`<table><thead><tr><th>Athlete</th><th>Event</th><th>Division</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>{const u=data.users.find(x=>x.id===r.userId);return `<tr><td>${esc(u?.name||'Unknown')}<br><span class="subtle">${esc(u?.email||'')}</span></td><td>${esc(eventName(r.eventId))}</td><td>${esc(r.division)}</td><td>${esc(r.status)}</td><td><div class="actions"><button class="action" onclick="setStatus('${r.id}','checked_in')">Check In</button><button class="action" onclick="setStatus('${r.id}','cancelled')">Cancel</button></div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No matching registrations.</div>'}
function renderAthletes(){const q=($('athSearch')?.value||'').toLowerCase();const rows=data.users.filter(u=>[u.name,u.email,u.role].join(' ').toLowerCase().includes(q));$('athTable').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No athletes yet.</div>'}
function renderResults(){$('revent').innerHTML=data.events.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');$('resultsTable').innerHTML=data.results.length?`<table><thead><tr><th>Event</th><th>Division</th><th>Athlete</th><th>Place</th></tr></thead><tbody>${data.results.slice().reverse().map(r=>`<tr><td>${esc(eventName(r.eventId))}</td><td>${esc(r.division)}</td><td>${esc(r.athlete)}</td><td>${esc(r.place)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No results have been entered yet.</div>'}
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}
function editEvent(id){const e=data.events.find(x=>x.id===id);if(!e)return;const name=prompt('Event name',e.name);if(name===null)return;const datev=prompt('Date (YYYY-MM-DD)',e.date);if(datev===null)return;const loc=prompt('Venue / location',e.location||'');if(loc===null)return;const addr=prompt('Address',e.address||'');if(addr===null)return;const fee=prompt('Entry fee',e.entryFee);if(fee===null)return;const status=prompt('Status: open or closed',e.status||'open');if(status===null)return;api('/api/admin/events/'+id,{method:'PATCH',body:JSON.stringify({name,date:datev,location:loc,address:addr,entryFee:Number(fee),status})}).then(load).catch(e=>alert(e.message))}
async function createEvent(){try{await api('/api/admin/events',{method:'POST',body:JSON.stringify({name:$('ename').value.trim(),date:$('edate').value,location:$('eloc').value.trim(),address:$('eaddr').value.trim(),entryFee:Number($('efee').value||0),entryUnit:$('eunit').value,doorsTime:$('edoors').value.trim(),startTime:$('estart').value.trim(),weightClasses:$('eweights').value.split(',').map(x=>x.trim()).filter(Boolean),divisions:$('eweights').value.split(',').map(x=>x.trim()).filter(Boolean),categories:$('ecats').value.split(',').map(x=>x.trim()).filter(Boolean),prizes:$('eprizes').value.split('\n').map(x=>x.trim()).filter(Boolean),description:$('edesc').value.trim()})});$('eventMsg').textContent='Event created.';load()}catch(e){$('eventMsg').textContent=e.message}}
async function setStatus(id,status){try{await api('/api/admin/registrations/'+id,{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){alert(e.message)}}
async function addResult(){try{await api('/api/admin/results',{method:'POST',body:JSON.stringify({eventId:$('revent').value,division:$('rdiv').value.trim(),athlete:$('rath').value.trim(),place:Number($('rplace').value)})});$('resultMsg').textContent='Result saved.';load()}catch(e){$('resultMsg').textContent=e.message}}
if(localStorage.getItem('faa_token')){showApp();load()}
</script></body></html>
