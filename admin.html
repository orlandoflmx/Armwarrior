<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAA Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}header{padding:18px 20px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#080808;z-index:2}h1{margin:0;font-size:22px;letter-spacing:1px}.wrap{max-width:1200px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button,.action{background:#222;color:#fff;border:1px solid #444;border-radius:10px;padding:10px 14px;white-space:nowrap;cursor:pointer}.tabs button.active,.primary{background:#d71920;border-color:#d71920}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}.card{background:#141414;border:1px solid #303030;border-radius:14px;padding:16px}.big{font-size:28px;font-weight:800}.muted{color:#aaa;font-size:13px}table{width:100%;border-collapse:collapse;background:#111;overflow:hidden}th,td{padding:11px;border-bottom:1px solid #292929;text-align:left;font-size:14px}th{color:#aaa}input,select,textarea{width:100%;padding:11px;background:#0d0d0d;border:1px solid #444;color:#fff;border-radius:9px;margin:5px 0 12px}label{font-size:13px;color:#bbb}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hide{display:none}.badge{padding:4px 8px;border-radius:99px;background:#272727;font-size:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><header><h1>FLORIDA ARMWRESTLING — ADMIN</h1><button class="action" onclick="location.href='index.html'">Open App</button></header><div class="wrap">
<div id="login" class="card"><h2>Admin Sign In</h2><p class="muted">Use an account with the admin role.</p><input id="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="action primary" onclick="login()">Sign In</button> <span id="loginMsg" class="muted"></span></div>
<div id="app" class="hide"><div class="tabs"><button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('events',this)">Events</button><button onclick="tab('roster',this)">Registrations</button><button onclick="tab('athletes',this)">Athletes</button><button onclick="tab('results',this)">Results</button></div>
<section id="dash" class="panel active"><div class="grid" id="stats"></div><div class="card"><h2>Recent Registrations</h2><div id="recent"></div></div></section>
<section id="events" class="panel"><div class="card"><h2>Create Event</h2><div class="row"><div><label>Name</label><input id="ename"></div><div><label>Date</label><input id="edate" type="date"></div><div><label>Location</label><input id="eloc" value="Florida"></div><div><label>Entry fee (payment later)</label><input id="efee" type="number" value="0"></div></div><label>Divisions</label><input id="ediv" value="Right Hand, Left Hand"><label>Description</label><textarea id="edesc"></textarea><button class="action primary" onclick="createEvent()">Create Event</button> <span id="eventMsg" class="muted"></span></div><div class="card"><h2>Events</h2><div id="eventsTable"></div></div></section>
<section id="roster" class="panel"><div class="card"><h2>Registration Roster</h2><div id="regTable"></div></div></section>
<section id="athletes" class="panel"><div class="card"><h2>Athletes</h2><div id="athTable"></div></div></section>
<section id="results" class="panel"><div class="card"><h2>Enter Result</h2><div class="row"><div><label>Event ID</label><input id="revent"></div><div><label>Division</label><input id="rdiv"></div><div><label>Athlete</label><input id="rath"></div><div><label>Place</label><input id="rplace" type="number"></div></div><button class="action primary" onclick="addResult()">Save Result</button> <span id="resultMsg" class="muted"></span></div><div class="card"><h2>Saved Results</h2><div id="resultsTable"></div></div></section>
</div></div>
<script>
const $=x=>document.getElementById(x);let data;
async function api(p,o={}){o.headers=Object.assign({"Content-Type":"application/json"},o.headers||{});let t=localStorage.getItem("faa_token");if(t)o.headers.Authorization="Bearer "+t;let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("pw").value})});if(d.user.role!=="admin")throw Error("This account is not an admin.");localStorage.setItem("faa_token",d.token);$("login").classList.add("hide");$("app").classList.remove("hide");load()}catch(e){$("loginMsg").textContent=e.message}}
async function load(){try{data=await api("/api/admin/dashboard");render()}catch(e){$("loginMsg").textContent=e.message;$("login").classList.remove("hide");$("app").classList.add("hide")}}
function table(h,rows){return `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function render(){$("stats").innerHTML=[["Events",data.events.length],["Athletes",data.users.length],["Registrations",data.registrations.length],["Results",data.results.length]].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=big>${x[1]}</div></div>`).join("");$("recent").innerHTML=data.registrations.slice(-10).reverse().map(r=>{let u=data.users.find(x=>x.id===r.userId),e=data.events.find(x=>x.id===r.eventId);return `<div style="padding:10px 0;border-bottom:1px solid #292929">${u?.name||"Unknown"} — ${e?.name||r.eventId} — ${r.division} <span class=badge>${r.status}</span></div>`}).join("")||"<p class=muted>No registrations yet.</p>";$("eventsTable").innerHTML=table(["Name","Date","Location","Fee","Divisions"],data.events.map(e=>[e.name,e.date,e.location,"$"+e.entryFee,e.divisions.join(", ")]));$("regTable").innerHTML=table(["Athlete","Event","Division","Status","Action"],data.registrations.map(r=>{let u=data.users.find(x=>x.id===r.userId),e=data.events.find(x=>x.id===r.eventId);return [u?.name||"Unknown",e?.name||r.eventId,r.division,r.status,`<button class=action onclick="setStatus('${r.id}','checked_in')">Check In</button> <button class=action onclick="setStatus('${r.id}','cancelled')">Cancel</button>`]}));$("athTable").innerHTML=table(["Name","Email","Role"],data.users.map(u=>[u.name,u.email,u.role]));$("resultsTable").innerHTML=table(["Event","Division","Athlete","Place"],data.results.map(r=>[r.eventId,r.division,r.athlete,r.place]))}
function tab(id,b){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id!=="events")load()}
async function createEvent(){try{await api("/api/admin/events",{method:"POST",body:JSON.stringify({name:$("ename").value,date:$("edate").value,location:$("eloc").value,entryFee:Number($("efee").value||0),divisions:$("ediv").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("edesc").value})});$("eventMsg").textContent=" Event created.";load()}catch(e){$("eventMsg").textContent=" "+e.message}}
async function setStatus(id,status){try{await api("/api/admin/registrations/"+id,{method:"PATCH",body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}
async function addResult(){try{await api("/api/admin/results",{method:"POST",body:JSON.stringify({eventId:$("revent").value,division:$("rdiv").value,athlete:$("rath").value,place:Number($("rplace").value)})});$("resultMsg").textContent=" Result saved.";load()}catch(e){$("resultMsg").textContent=" "+e.message}}
</script></body></html>
